[package]
name = "lumenscan-testdata"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Fixture contract for Lumenscan's tests; exercises every SCSpecEntry kind."

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "27.0.5"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# Its own workspace: this crate builds for wasm and is not part of the CLI's
# build or test run.
[workspace]
